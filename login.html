<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff9800" />

    <meta
      name="description"
      content="Login Admin DiengNET Property Management System"
    />

    <title>DiengNET PMS — Admin Login</title>

    <!-- FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="assets/css/admin/login.css" />

    <!-- ICON -->

    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <main class="admin-login-page">
      <section class="admin-login-card">
        <!-- BRAND -->

        <div class="admin-login-brand">
          <div class="admin-login-logo">
            <i data-lucide="shield-check"></i>
          </div>

          <div class="admin-login-brand-text">
            <strong>DiengNET PMS</strong>
            <span>Administrator Workspace</span>
          </div>
        </div>

        <!-- INTRO -->

        <div class="admin-login-intro">
          <span class="admin-login-eyebrow">ADMIN LOGIN</span>

          <h1>Selamat datang kembali</h1>

          <p>Masuk untuk mengelola operasional DiengNET PMS.</p>
        </div>

        <!-- FORM -->

        <form id="adminLoginForm" class="admin-login-form">
          <div class="admin-login-field">
            <label for="adminUsername">Username</label>

            <div class="admin-login-input-wrap">
              <i data-lucide="user-round"></i>

              <input
                type="text"
                id="adminUsername"
                name="username"
                placeholder="Masukkan username"
                autocomplete="username"
                required
              />
            </div>
          </div>

          <div class="admin-login-field">
            <label for="adminPassword">Password</label>

            <div class="admin-login-input-wrap">
              <i data-lucide="lock-keyhole"></i>

              <input
                type="password"
                id="adminPassword"
                name="password"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                id="toggleAdminPassword"
                class="admin-login-password-toggle"
                aria-label="Tampilkan password"
              >
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="btnAdminLogin" class="admin-login-button">
            <span>Masuk ke Dashboard</span>
            <i data-lucide="arrow-right"></i>
          </button>
        </form>

        <!-- FOOTER -->

        <div class="admin-login-footer">
          <span>DiengNET PMS</span>
          <span>Administrator Workspace</span>
        </div>
      </section>
    </main>

    <!-- QEDEV CORE -->

    <script src="assets/js/core/config.js"></script>
    <script src="assets/js/core/storage.js"></script>
    <script src="assets/js/core/state.js"></script>
    <script src="assets/js/core/api.js"></script>
    <script src="assets/js/core/engine-toast.js"></script>
    <script src="assets/js/core/auth.js"></script>

    <!-- ADMIN LOGIN -->

    <script src="assets/js/modules/admin/login.js"></script>
  </body>
</html>
