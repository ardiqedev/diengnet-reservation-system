<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#ff9800" />

    <title>Dieng Stay — Reservasi</title>

    <!-- =========================================
       FONT
  ========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- =========================================
       OWNER CSS
  ========================================== -->

    <link rel="stylesheet" href="../../assets/css/owner/owner.css" />

    <link rel="stylesheet" href="../../assets/css/owner/reservasi.css" />

    <!-- =========================================
       ICON
  ========================================== -->

    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <div class="owner-app">
      <!-- =======================================
         HEADER
    ======================================== -->

      <header class="owner-header">
        <div class="owner-header-inner">
          <a href="../index.html" class="owner-page-back" aria-label="Kembali">
            <i data-lucide="arrow-left"></i>
          </a>

          <div class="owner-page-title">
            <strong> Reservasi </strong>

            <span> Check-in / Check-out </span>
          </div>

          <div class="owner-header-spacer"></div>
        </div>
      </header>

      <!-- =======================================
         MAIN
    ======================================== -->

      <main class="owner-main owner-reservation-main">
        <!-- =====================================
           INTRO
      ====================================== -->

        <section class="owner-reservation-intro">
          <span class="owner-eyebrow"> OPERASIONAL </span>

          <h1>Cari Reservasi</h1>

          <p>Masukkan nomor reservasi untuk memeriksa status tamu.</p>
        </section>

        <!-- =====================================
           SEARCH
      ====================================== -->

        <section class="reservation-search-card">
          <!-- =====================================
     NOMOR RESERVASI
  ====================================== -->

          <label for="reservationCode" class="reservation-search-label">
            Nomor Reservasi
          </label>

          <div class="reservation-search-input-wrap">
            <i data-lucide="search"></i>

            <input
              type="text"
              id="reservationCode"
              name="reservationCode"
              placeholder="Contoh: RSV-261008-1234"
              autocomplete="off"
              spellcheck="false"
            />

            <button
              type="button"
              id="btnClearReservation"
              class="reservation-clear-button"
              aria-label="Hapus"
              hidden
            >
              <i data-lucide="x"></i>
            </button>
          </div>

          <!-- =====================================
     SEARCH BUTTON
  ====================================== -->

          <button
            type="button"
            id="btnSearchReservation"
            class="reservation-search-button"
          >
            <i data-lucide="search"></i>

            <span> Cari Reservasi </span>
          </button>
        </section>

        <!-- =====================================
           RESULT
      ====================================== -->

        <section id="reservationResult" class="reservation-result">
          <!-- Render by JS -->
        </section>

        <!-- =====================================
           HELP
      ====================================== -->

        <section class="reservation-help-card">
          <div class="reservation-help-icon">
            <i data-lucide="info"></i>
          </div>

          <div>
            <strong>Nomor reservasi</strong>

            <p>
              Gunakan kode reservasi untuk mencari data tamu dan status
              menginap.
            </p>
          </div>
        </section>
      </main>

      <!-- =======================================
         BOTTOM NAV
    ======================================== -->

      <nav class="owner-bottom-nav">
        <a href="../index.html" class="owner-nav-item">
          <i data-lucide="house"></i>

          <span> Beranda </span>
        </a>

        <a href="./reservasi.html" class="owner-nav-item active">
          <i data-lucide="calendar-days"></i>

          <span> Reservasi </span>
        </a>

        <button type="button" class="owner-nav-item">
          <i data-lucide="bed-double"></i>

          <span> Kamar </span>
        </button>

        <button type="button" class="owner-nav-item">
          <i data-lucide="wallet"></i>

          <span> Pencairan </span>
        </button>

        <button type="button" class="owner-nav-item">
          <i data-lucide="user-round"></i>

          <span> Akun </span>
        </button>
      </nav>
    </div>

    <!-- =========================================
    CORE JS
    ========================================== -->

    <script src="../../assets/js/core/config.js"></script>

    <script src="../../assets/js/core/storage.js"></script>

    <script src="../../assets/js/core/state.js"></script>

    <script src="../../assets/js/core/api.js"></script>

    <script src="../../assets/js/core/auth.js"></script>

    <!-- =========================================
        JS
    ========================================== -->

    <script src="../../assets/js/modules/owner/reservasi.js"></script>
  </body>
</html>
