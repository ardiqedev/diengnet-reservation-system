<!-- =========================================
     NAVBAR LEFT
========================================= -->

<div class="navbar-left">
  <!-- Sidebar Toggle -->

  <button id="btnSidebar" class="nav-button">
    <i data-lucide="panel-left"></i>
  </button>

  <!-- Page Title -->

  <div class="navbar-title">
    <h1 id="pageTitle">Dashboard</h1>

    <span> Selamat datang kembali 👋 </span>
  </div>
</div>

<!-- =========================================
     NAVBAR RIGHT
========================================= -->

<div class="navbar-right">
  <!-- Search -->

  <div class="search-box">
    <i data-lucide="search"></i>

    <input type="text" placeholder="Cari..." />
  </div>

  <!-- Notification -->

  <button class="nav-button">
    <i data-lucide="bell"></i>

    <span class="badge-dot"></span>
  </button>

  <!-- Theme -->

  <button class="nav-button">
    <i data-lucide="moon"></i>
  </button>

  <!-- User Profile Dropdown -->

  <div class="profile-dropdown" id="profileDropdown">
    <button
      type="button"
      class="profile-button"
      id="btnProfileDropdown"
      aria-expanded="false"
      aria-haspopup="true"
    >
      <div class="profile-avatar" id="profileAvatar">AD</div>

      <div class="profile-detail">
        <strong id="profileName">Administrator</strong>
        <small id="profileRole">Super Admin</small>
      </div>

      <i data-lucide="chevron-down"></i>
    </button>

    <div class="profile-menu" id="profileMenu" hidden>
      <div class="profile-menu-header">
        <strong id="profileMenuName">Administrator</strong>
        <small id="profileMenuRole">Super Admin</small>
      </div>

      <div class="profile-menu-divider"></div>

      <button type="button" class="profile-menu-item" id="btnLogout">
        <i data-lucide="log-out"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>
</div>
