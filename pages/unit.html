<!-- =========================================
     MASTER UNIT
========================================= -->

<div class="page">
  <!-- =====================================
       HEADER
  ====================================== -->

  <div class="page-header">
    <div>
      <h1>Master Unit</h1>

      <p>Kelola seluruh unit yang tersedia pada setiap penginapan.</p>
    </div>

    <button class="btn btn-primary" onclick="Unit.openForm()">
      <i data-lucide="plus"></i>

      Tambah Unit
    </button>
  </div>

  <!-- =====================================
       SUMMARY
  ====================================== -->

  <div class="stats-grid">
    <div class="card stat-card">
      <div class="stat-content">
        <div class="stat-title">Total Unit</div>

        <div id="totalUnit" class="stat-value">0</div>
      </div>

      <div class="stat-icon">
        <i data-lucide="bed-double"></i>
      </div>
    </div>

    <div class="card stat-card">
      <div class="stat-content">
        <div class="stat-title">Total Kapasitas</div>

        <div id="totalKapasitas" class="stat-value">0 Orang</div>
      </div>

      <div class="stat-icon">
        <i data-lucide="users"></i>
      </div>
    </div>

    <div class="card stat-card">
      <div class="stat-content">
        <div class="stat-title">Unit Aktif</div>

        <div id="totalAktif" class="stat-value">0</div>
      </div>

      <div class="stat-icon">
        <i data-lucide="circle-check"></i>
      </div>
    </div>
  </div>

  <!-- =====================================
       TOOLBAR
  ====================================== -->

  <div class="search-box">
    <i data-lucide="search"></i>

    <input
      id="searchUnit"
      type="text"
      class="form-control"
      placeholder="Cari unit, tipe, atau penginapan..."
    />

    <button
      type="button"
      id="clearSearchUnit"
      class="search-clear"
      aria-label="Hapus pencarian"
    >
      <i data-lucide="x"></i>
    </button>
  </div>

  <!-- =====================================
       TABLE
  ====================================== -->

  <div class="card">
    <div id="tableUnit"></div>

    <div id="paginationUnit" class="pagination-wrapper"></div>
  </div>
</div>
