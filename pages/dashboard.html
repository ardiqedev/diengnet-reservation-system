<div class="page">
  <div class="grid grid-4">
    <!-- Reservasi -->

    <div class="card card-simple stat-card">
      <div class="stat-content">
        <span class="stat-label"> Reservasi Hari Ini </span>

        <h2 class="stat-value">24</h2>

        <span class="stat-change"> +12% </span>
      </div>

      <div class="stat-icon">
        <i data-lucide="calendar-days"></i>
      </div>
    </div>

    <!-- Check In -->

    <div class="card card-simple stat-card">
      <div class="stat-content">
        <span class="stat-label"> Check In </span>

        <h2 class="stat-value">12</h2>

        <span class="stat-change"> Hari Ini </span>
      </div>

      <div class="stat-icon">
        <i data-lucide="log-in"></i>
      </div>
    </div>

    <!-- Check Out -->

    <div class="card card-simple stat-card">
      <div class="stat-content">
        <span class="stat-label"> Check Out </span>

        <h2 class="stat-value">8</h2>

        <span class="stat-change"> Hari Ini </span>
      </div>

      <div class="stat-icon">
        <i data-lucide="log-out"></i>
      </div>
    </div>

    <!-- Pendapatan -->

    <div class="card card-simple stat-card">
      <div class="stat-content">
        <span class="stat-label"> Pendapatan </span>

        <h2 class="stat-value">Rp2,3 Jt</h2>

        <span class="stat-change"> +18% </span>
      </div>

      <div class="stat-icon">
        <i data-lucide="wallet"></i>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div>
          <h3 class="card-title">Occupancy Hari Ini</h3>

          <p class="card-subtitle">Status keterisian kamar</p>
        </div>

        <div class="stat-icon">
          <i data-lucide="hotel"></i>
        </div>
      </div>

      <div class="card-body">
        <div class="occupancy-percent">72%</div>

        <div class="progress">
          <div class="progress-bar" style="width: 72%"></div>
        </div>

        <div class="occupancy-info">
          <div>
            <strong>36</strong>

            <span>Terisi</span>
          </div>

          <div>
            <strong>14</strong>

            <span>Kosong</span>
          </div>

          <div>
            <strong>50</strong>

            <span>Total</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div>
          <h3 class="card-title">Status Kamar</h3>

          <p class="card-subtitle">Kondisi kamar saat ini</p>
        </div>

        <div class="stat-icon">
          <i data-lucide="bed-double"></i>
        </div>
      </div>

      <div class="card-body">
        <div class="room-status-list">
          <div class="room-status-item">
            <div class="room-status-label">
              <span class="dot success"></span>

              Tersedia
            </div>

            <strong>14</strong>
          </div>

          <div class="room-status-item">
            <div class="room-status-label">
              <span class="dot primary"></span>

              Terisi
            </div>

            <strong>36</strong>
          </div>

          <div class="room-status-item">
            <div class="room-status-label">
              <span class="dot warning"></span>

              Dibersihkan
            </div>

            <strong>3</strong>
          </div>

          <div class="room-status-item">
            <div class="room-status-label">
              <span class="dot danger"></span>

              Maintenance
            </div>

            <strong>1</strong>
          </div>
        </div>

        <div class="room-total">
          <span>Total Kamar</span>

          <strong>54</strong>
        </div>
      </div>
    </div>
  </div>
</div>
